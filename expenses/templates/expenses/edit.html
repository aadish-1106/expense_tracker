<h2>Edit Expense</h2>

<form method="post">
  {% csrf_token %}
  Amount: <input type="number" step="0.01" name="amount" value="{{ expense.amount }}"><br>
  Category: <input type="text" name="category" value="{{ expense.category }}"><br>
  Date: <input type="date" name="date" value="{{ expense.date }}"><br>
  Description: <textarea name="description">{{ expense.description }}</textarea><br>
  <button type="submit">Update</button>
</form>
